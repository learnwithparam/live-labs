[project]
name = "lab-39-capstone-production-deploy"
version = "0.1.0"
description = "Deploy a Hardened AI Service with Rate Limits: per-client keys, a token bucket, fallback with a circuit breaker and a cost ledger checked against provider billing"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
brickhaven-api = "brickhaven_api.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brickhaven_api"]

[tool.pytest.ini_options]
markers = ["proof: runs a real load test against a real model and checks the ledger against provider billing; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
