[project]
name = "lab-15-research-subagents"
version = "0.1.0"
description = "Build a Deep Research Agent with Subagents: a lead agent plans, runs searchers in parallel and writes a cited report, scored beside a single agent on claims their sources support and cost per report"
requires-python = ">=3.11"
dependencies = ["openai==2.54.0"]

[project.scripts]
research = "kitebird.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitebird"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
