[project]
name = "lab-38-capstone-eval-gate"
version = "0.1.0"
description = "Verify Production AI Quality with CI Evals: a human-verified golden dataset, a pass rate per field and a release gate that blocks any regression"
requires-python = ">=3.11,<3.14"
dependencies = ["openai==2.54.0"]

[project.scripts]
brickhaven-evals = "brickhaven_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brickhaven_evals"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
