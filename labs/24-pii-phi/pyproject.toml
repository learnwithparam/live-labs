[project]
name = "lab-24-pii-phi"
version = "0.1.0"
description = "Redact PII and PHI before the LLM: a clinical scribe strips Safe Harbor identifiers from visit transcripts with Presidio, scored on spans a person annotated"
requires-python = ">=3.11,<3.14"
dependencies = [
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "spacy==3.8.16",
    "en-core-web-md",
    "openai==2.54.0",
]

[project.scripts]
scribe = "wrenfield.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wrenfield"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.uv.sources]
# spaCy ships its trained pipelines as wheels on GitHub, not PyPI, so the model is pinned by URL.
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
