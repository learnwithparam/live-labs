[project]
name = "lab-19-decision-ai"
version = "0.1.0"
description = "Score Risk with a Decision Model: a marketplace's refunds scored by a calibrated gradient-boosted model, with thresholds set from a review budget and graded on chargebacks found later"
requires-python = ">=3.11"
dependencies = ["scikit-learn==1.9.1", "numpy>=2.4", "openai==2.54.0"]

[project.scripts]
refunds = "fennick.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fennick"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
