[project]
name = "lab-37-capstone-tracer-bullet"
version = "0.1.0"
description = "Ship an End-to-End AI Pipeline with OpenTelemetry: a maintenance message becomes a dispatched work order, with a span for every step and tool, retries, a repair step and a human queue, checked against the spans in Jaeger"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai==2.54.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
]

[project.scripts]
brickhaven-slice = "brickhaven_slice.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brickhaven_slice"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model and reads the spans back from Jaeger; needs LLM_API_KEY and Docker"]
addopts = "-m 'not proof'"
