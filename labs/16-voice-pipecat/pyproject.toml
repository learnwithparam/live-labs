[project]
name = "lab-16-voice-pipecat"
version = "0.1.0"
description = "Build a Voice AI Agent with Pipecat: a pizzeria's phone orders taken by a local voice pipeline and keyed into the till"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pipecat-ai[whisper,kokoro,silero,webrtc,openai]==1.12.0",
    # Pipecat 1.12's whisper module imports mlx_whisper on every Apple Silicon Mac, even for faster-whisper.
    "mlx-whisper~=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
phoneline = "lucca.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucca"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
# Pipecat 1.12 imports audioop and importlib's old path(); both warn on every run and neither is ours.
filterwarnings = ["ignore::DeprecationWarning"]
