[project]
name = "lab-16-voice-pipecat"
version = "0.1.0"
description = "Build a Voice AI Agent with Pipecat: a pizzeria's phone orders taken by a local voice pipeline and keyed into the till"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pipecat-ai[whisper,kokoro,silero,webrtc,openai,runner]==1.12.0",
    # Speech to text on the Mac's GPU. Pipecat ships the service; MLX Whisper is its engine.
    "pipecat-ai[mlx-whisper]==1.12.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # The voice on the Mac's GPU, as Pipecat's macOS local agent runs it: half the CPU Kokoro's wait.
    "mlx-audio; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki[en]; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # misaki's English spelling model, pinned here so it is never fetched while a caller waits.
    "en-core-web-sm; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
phoneline = "lucca.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucca"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
# Pipecat 1.12 imports audioop and importlib's old path(); both warn on every run and neither is ours.
filterwarnings = ["ignore::DeprecationWarning"]
