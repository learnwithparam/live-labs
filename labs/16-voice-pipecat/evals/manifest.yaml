# `phoneline review` runs this with Pipecat's own eval suite: each recorded call is one scenario,
# played into a fresh bot over the eval transport, one call at a time as a single phone line takes them.
concurrency: 1
runs_dir: ../out/evals
spawn: "{python} {bot} -t eval --port {port}"
suite:
  - bot: ../src/lucca/bot.py
    name: LB-01
    runner_body:
      data: {call: LB-01, order_number: 412}
    scenarios: [LB-01]
  - bot: ../src/lucca/bot.py
    name: LB-02
    runner_body:
      data: {call: LB-02, order_number: 413}
    scenarios: [LB-02]
