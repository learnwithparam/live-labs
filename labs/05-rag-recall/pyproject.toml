[project]
name = "lab-05-rag-recall"
version = "0.1.0"
description = "Measure RAG Accuracy with Recall@k: find the runbook section a question needs, and prove it on a labelled set"
requires-python = ">=3.11"
dependencies = ["fastembed==0.8.1", "qdrant-client==1.19.1", "pypdf>=6.1"]

[project.scripts]
wiki = "wiki.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki"]

[tool.pytest.ini_options]
markers = ["proof: downloads the real models and measures recall on the golden set"]
addopts = "-m 'not proof'"
