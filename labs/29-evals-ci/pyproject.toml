[project]
name = "lab-29-evals-ci"
version = "0.1.0"
description = "Gate AI Releases with Evals in CI: a merchant admin assistant's release candidates scored on answers and tool trajectories with DeepEval, blocked in CI when a case gets worse"
requires-python = ">=3.11,<3.14"
dependencies = ["deepeval==4.2.7", "openai==2.54.0"]

[project.scripts]
kettlebay = "kettlebay.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kettlebay"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
# The lab scores with DeepEval's metrics; its pytest plugin only prints a teardown line.
addopts = "-m 'not proof' -p no:deepeval"
