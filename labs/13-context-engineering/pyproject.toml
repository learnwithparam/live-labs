[project]
name = "lab-13-context-engineering"
version = "0.1.0"
description = "Cut Agent Token Costs with Context Engineering: a freight invoice audit agent run with a naive and an engineered context, costed from the provider's bill"
requires-python = ">=3.11"
dependencies = ["openai==2.54.0"]

[project.scripts]
audit = "halyard.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halyard"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
