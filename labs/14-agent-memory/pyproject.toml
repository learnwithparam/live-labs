[project]
name = "lab-14-agent-memory"
version = "0.1.0"
description = "Add Long-Term Memory to AI Agents with Mem0: a pet food support agent that remembers across sessions, replaces stale facts and forgets on request"
requires-python = ">=3.11"
dependencies = ["fastembed==0.8.1", "mem0ai==2.2.1", "openai==2.54.0"]

[project.scripts]
support = "pawsley.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pawsley"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
# Raised inside a dependency, not by this lab's code.
filterwarnings = ["ignore:Cannot enable progress bars:UserWarning"]
