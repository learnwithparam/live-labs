[project]
name = "lab-10-durable-workflow"
version = "0.1.0"
description = "Make an AI Workflow Survive a Crash: a refund that waits for a manager and pays out exactly once, on Temporal"
requires-python = ">=3.11"
dependencies = ["temporalio>=1.33", "openai>=1.100", "pydantic>=2.11"]

[project.scripts]
refund = "refunds.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refunds"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
asyncio_mode = "auto"
