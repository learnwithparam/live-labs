[project]
name = "lab-18-vision-damage"
version = "0.1.0"
description = "Assess Car Damage Photos with Vision LLMs: a motor insurer's claim photos read into structured damage, priced in code from a rate table, with the doubtful claims sent to an adjuster"
requires-python = ">=3.11"
dependencies = ["openai==2.54.0"]

[project.scripts]
claims = "saltmarsh.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saltmarsh"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
