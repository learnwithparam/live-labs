[project]
name = "lab-28-tracing"
version = "0.1.0"
description = "Trace AI Agents with OpenTelemetry: a helpdesk's AI features traced with the GenAI conventions in Jaeger, so the provider's invoice is split by customer and feature, and a slow run by step"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai==2.54.0",
    "httpx==0.28.1",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-instrumentation-openai-v2==2.4b0",
    # The instrumentation accepts any newer helper, but 1.x dropped a module it imports; 0.4b0 shipped with it.
    "opentelemetry-util-genai==0.4b0",
    "opentelemetry-processor-baggage==0.66b0",
]

[project.scripts]
quill = "quillmark.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quillmark"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
