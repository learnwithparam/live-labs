[project]
name = "lab-02-golden-set"
version = "0.1.0"
description = "Build a Golden Set for an LLM Feature: score every prompt change against postings a person approved"
requires-python = ">=3.11"
dependencies = ["openai>=1.100", "pydantic>=2.11"]

[project.scripts]
postings = "postings.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postings"]

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
