[project]
name = "lab-26-llm-gateway"
version = "0.1.0"
description = "Route LLM Calls with an LLM Gateway: a grocery delivery company's LiteLLM proxy sends each call to the cheapest model that answers it well, scored on a labelled quality set and the provider's own bill"
requires-python = ">=3.11,<3.14"
dependencies = ["litellm[proxy]==1.103.1", "openai==2.54.0"]

[project.scripts]
gateway = "fernway.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fernway"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
