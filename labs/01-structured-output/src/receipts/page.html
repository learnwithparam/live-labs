<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt matcher</title>
<style>
/* Colours are the workshop tokens in design/tokens.json; a course test pins every hex here to that file. */
:root {
  --paper: #FAFAFA; --card: #FFFFFF; --ink: #151515; --ink-2: #414141; --muted: #606060;
  --line: #DFDFDF; --accent: #FAFF69; --accent-deep: #4F5101; --fill-dark: #1F1F1C;
  --pass: #008138; --fail: #BF000F; --wait: #B75000;
  --sans: Inter, Helvetica, Arial, sans-serif; --mono: Inconsolata, "Courier New", Courier, monospace;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans) }
header { display: flex; align-items: baseline; gap: 16px; padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--card) }
header h1 { margin: 0; font-size: 20px }
header .model { color: var(--muted); font-family: var(--mono) }
header .spacer { flex: 1 }
header .tally { font-weight: 700 }
button { font: inherit; font-weight: 600; border: 1px solid var(--ink); border-radius: 4px; padding: 7px 14px; background: var(--card); color: var(--ink); cursor: pointer }
button.primary { background: var(--accent) }
button:disabled { opacity: .5; cursor: wait }
main { display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; padding: 20px 28px }
aside ul { list-style: none; margin: 0; padding: 0 }
aside li button { width: 100%; text-align: left; border: 1px solid transparent; background: none; font-weight: 400; display: flex; gap: 8px; align-items: center; padding: 8px 10px }
aside li button[aria-current="true"] { background: var(--accent); border-color: var(--ink) }
.kind { font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-left: auto; background: var(--line) }
.dot.matched { background: var(--pass) } .dot.person { background: var(--wait) }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 16px; min-height: 200px }
.panel h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.source img { max-width: 100%; display: block }
.source iframe { width: 100%; height: 640px; border: 0 }
.source pre, .raw { font: 14px/1.5 var(--mono); white-space: pre-wrap; margin: 0 }
.raw { background: var(--fill-dark); color: var(--paper); padding: 14px; border-radius: 4px; max-height: 300px; overflow: auto }
.actions { display: flex; gap: 10px; margin-bottom: 14px }
.verdict { font-weight: 700; margin: 10px 0 }
.pass { color: var(--pass) } .fail { color: var(--fail) } .wait { color: var(--wait) }
.attempt { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px }
.attempt h3 { margin: 0 0 6px; font-size: 15px }
table.sum { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 14px }
table.sum td { padding: 2px 0 } table.sum td:last-child { text-align: right }
table.sum tr.result td { border-top: 1px solid var(--ink); font-weight: 700; padding-top: 4px }
.sentback { margin-top: 8px; border-left: 3px solid var(--fail); padding: 6px 10px; font: 13px/1.45 var(--mono); white-space: pre-wrap; color: var(--ink-2) }
.outcome .decide { margin: 8px 0 0; font-weight: 400; color: var(--ink) }
.outcome { margin-top: 14px; padding: 10px 12px; border-radius: 4px; font-weight: 700; border: 2px solid currentColor }
section.books { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0 28px 28px }
table.book { width: 100%; border-collapse: collapse; font-size: 14px }
table.book th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line) }
table.book td { padding: 4px 0; border-bottom: 1px solid var(--line) } table.book td.num { text-align: right; font-family: var(--mono) }
.empty { color: var(--muted) }
.charge { margin-top: 14px; border: 2px solid var(--pass); border-radius: 4px; padding: 10px 12px }
.charge .desc { font: 700 15px var(--mono) }
.charge ul { list-style: none; margin: 8px 0 0; padding: 0; font-size: 14px }
.charge li::before { content: "\2713  "; color: var(--pass); font-weight: 700 }
.charge li b { display: inline-block; width: 78px }
tr.hit td { background: var(--accent) }
.charge.flag { border-color: var(--wait) } .charge.flag .verdict { color: var(--wait) }
table.book td.num { padding-right: 16px }
</style>
</head>
<body data-surface="expense receipt inbox">
<header>
  <h1>Receipt matcher</h1>
  <span class="model" id="model"></span>
  <span class="spacer"></span>
  <span class="tally" id="tally"></span>
  <button id="run-all" class="primary">Match every receipt</button>
</header>
<main>
  <aside><ul id="list"></ul></aside>
  <div class="panel source"><h2>The receipt as it arrived</h2><div id="source"></div></div>
  <div class="panel" aria-live="polite">
    <h2>What the model read, and the charge it matches</h2>
    <div class="actions">
      <button id="naive">Ask for JSON</button>
      <button id="extract" class="primary">Extract and match</button>
    </div>
    <div id="result"><p class="empty">Ask the obvious way first, then extract and match.</p></div>
  </div>
</main>
<section class="books">
  <div class="panel"><h2>Card charges from the bank</h2><div id="feed"></div></div>
  <div class="panel"><h2>Needs a person</h2><div id="review"></div></div>
</section>
<script>
const state = { receipts: [], charges: [], results: {}, current: null };
const $ = (id) => document.getElementById(id);
const escapeHtml = (text) => String(text).replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[char]);
const money = (amount) => (typeof amount === "number" ? amount.toFixed(2) : escapeHtml(amount));

async function load() {
  const data = await (await fetch("/api/receipts")).json();
  Object.assign(state, { receipts: data.receipts, charges: data.charges, results: data.results });
  $("model").textContent = data.model;
  select(state.current || data.receipts[0].name);
}

function select(name) {
  state.current = name;
  const receipt = state.receipts.find((candidate) => candidate.name === name);
  const src = "/files/" + encodeURIComponent(name);
  $("source").innerHTML = receipt.kind === "pdf" ? `<iframe title="${escapeHtml(name)}" src="${src}#toolbar=0&view=FitH"></iframe>`
    : receipt.kind === "txt" ? "<pre id='text'></pre>" : `<img alt="Photo of ${escapeHtml(name)}" src="${src}">`;
  if (receipt.kind === "txt") fetch(src).then((response) => response.text()).then((text) => ($("text").textContent = text));
  const done = state.results[name];
  $("result").innerHTML = done ? outcome(done) : '<p class="empty">Ask the obvious way first, then extract and match.</p>';
  render();
}

function render() {
  $("list").innerHTML = state.receipts.map((receipt) => {
    const status = state.results[receipt.name]?.status || "";
    return `<li><button data-name="${escapeHtml(receipt.name)}" aria-current="${receipt.name === state.current}">${escapeHtml(receipt.name.replace(/\.\w+$/, ""))}
      <span class="kind">${receipt.kind}</span><span class="dot ${status}" title="${status}"></span></button></li>`;
  }).join("");
  const paidBy = Object.fromEntries(Object.entries(state.results).filter(([, result]) => result.charge).map(([name, result]) => [result.charge.id, name]));
  $("feed").innerHTML = `<table class="book"><tr><th>Date</th><th>Descriptor</th><th>USD</th><th>Receipt</th></tr>${state.charges.map((charge) =>
    `<tr class="${paidBy[charge.id] === state.current ? "hit" : ""}"><td>${charge.date.slice(5)}</td><td>${escapeHtml(charge.descriptor)}${charge.original_currency ? ` <span class="kind">${charge.original_currency} ${money(charge.original_amount)}</span>` : ""}</td>
    <td class="num">${money(charge.amount)}</td><td>${paidBy[charge.id] ? escapeHtml(paidBy[charge.id].replace(/\.\w+$/, "")) : ""}</td></tr>`).join("")}</table>`;
  const person = Object.entries(state.results).filter(([, result]) => result.status === "person");
  const settled = Object.keys(state.results).length;
  $("tally").innerHTML = settled ? `<span class="pass">${settled - person.length} of ${settled} matched with no person</span>, <span class="wait">${person.length} need${person.length === 1 ? "s" : ""} a person</span>` : "";
  $("review").innerHTML = person.length ? `<table class="book"><tr><th>Receipt</th><th>Why</th></tr>${person.map(([name, result]) =>
    `<tr><td>${escapeHtml(name)}</td><td class="wait">${escapeHtml(result.reason)}</td></tr>`).join("")}</table>`
    : '<p class="empty">No receipt is waiting on a person.</p>';
}

const firstLine = (error) => (error.split("\n").find((line) => line.includes("error,")) || error.split("\n")[1] || error).replace(/^\s*Value error, /, "").replace(/ \[type=.*$/, "");

function sum(breakdown) {
  if (!breakdown) return '<p class="fail">The reply did not even parse as a ledger entry.</p>';
  const rows = breakdown.items.map(([description, amount]) => `<tr><td>${escapeHtml(description)}</td><td>${money(amount)}</td></tr>`);
  if (breakdown.discount) rows.push(`<tr><td>minus discount</td><td>-${money(breakdown.discount)}</td></tr>`);
  rows.push(breakdown.tax_included ? `<tr><td>tax ${money(breakdown.tax)}, already in the prices</td><td>+0.00</td></tr>` : `<tr><td>plus tax</td><td>+${money(breakdown.tax)}</td></tr>`);
  if (breakdown.tip) rows.push(`<tr><td>plus tip</td><td>+${money(breakdown.tip)}</td></tr>`);
  const ok = Math.abs(breakdown.expected - breakdown.total) <= 0.01;
  rows.push(`<tr class="result"><td>adds up to</td><td>${money(breakdown.expected)}</td></tr>`);
  rows.push(`<tr class="result ${ok ? "pass" : "fail"}"><td>printed total ${ok ? "matches" : "does not match"}</td><td>${money(breakdown.total)}</td></tr>`);
  return `<table class="sum">${rows.join("")}</table>`;
}

function outcome(result) {
  const parts = result.attempts.map((attempt, index) => `<div class="attempt"><h3>Attempt ${index + 1}</h3>${sum(attempt.sum)}
    ${attempt.error ? `<div class="sentback"><strong>Sent back to the model:</strong>\n${escapeHtml(firstLine(attempt.error))}</div>` : ""}</div>`);
  const end = result.charge
    ? `<div class="charge ${result.entry ? "" : "flag"}"><div class="desc">${result.charge.id} ${escapeHtml(result.charge.descriptor)}</div><ul>${Object.entries(result.checks).map(([check, detail]) =>
      `<li><b>${check}</b>${escapeHtml(detail)}</li>`).join("")}</ul><div class="verdict pass">${result.entry ? "Matched with no person" : "Matched, flagged"}: ${escapeHtml(result.reason)}</div></div>`
    : `<div class="outcome wait">Needs a person: ${escapeHtml(result.reason)}<p class="decide">A person decides: attach it to a charge by hand, or file it as out of pocket.</p></div>`;
  return parts.join("") + end;
}

async function post(action, name) {
  return (await fetch(`/api/${action}/${encodeURIComponent(name)}`, { method: "POST" })).json();
}

async function busy(work) {
  document.querySelectorAll("button").forEach((button) => (button.disabled = true));
  try { await work(); } finally { document.querySelectorAll("button").forEach((button) => (button.disabled = false)); }
}

$("list").addEventListener("click", (event) => { const button = event.target.closest("button"); if (button) select(button.dataset.name); });
$("naive").addEventListener("click", () => busy(async () => {
  $("result").innerHTML = '<p class="empty">Asking with no schema and no rule...</p>';
  const naive = await post("naive", state.current);
  $("result").innerHTML = `<pre class="raw">${escapeHtml(naive.reply)}</pre><p class="verdict ${naive.plain_json ? "pass" : "fail"}">${naive.plain_json
    ? "Plain JSON this time. Now find the total: every receipt names it differently."
    : "Not JSON as sent: json.loads fails on the Markdown fence around it."}</p>`;
}));
$("extract").addEventListener("click", () => busy(async () => {
  $("result").innerHTML = '<p class="empty">Extracting against the schema, then checking the sum...</p>';
  state.results[state.current] = await post("extract", state.current);
  select(state.current);
}));
$("run-all").addEventListener("click", () => busy(async () => {
  for (const receipt of state.receipts) { state.results[receipt.name] = await post("extract", receipt.name); select(receipt.name); }
}));
load();
</script>
</body>
</html>
