[project]
name = "lab-01-structured-output"
version = "0.1.0"
description = "Extract Structured Data with LLMs: receipts read, checked and matched to the card feed"
requires-python = ">=3.11"
dependencies = ["openai>=1.100", "pydantic>=2.11"]

[project.scripts]
receipts = "receipts.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipts"]

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
