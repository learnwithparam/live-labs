[project]
name = "lab-17-voice-phone"
version = "0.1.0"
description = "Build a Phone AI Agent with LiveKit: a heating and cooling company's inbound line answered by a voice agent on LiveKit Cloud, tested by simulated callers"
requires-python = ">=3.11,<3.14"
dependencies = [
    "livekit-agents==1.8.3",
    "livekit-plugins-openai==1.8.3",
    "numpy==2.4.6",
]

[project.scripts]
phone = "northfield.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northfield"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
