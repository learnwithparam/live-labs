[project]
name = "lab-11-agent-loop"
version = "0.1.0"
description = "Build an AI Agent Loop with Tool Calling: resolve order-support chats with tools in a loop, then the same agent in Google ADK"
requires-python = ">=3.11"
dependencies = ["openai==2.54.0", "google-adk==2.10.0", "litellm==1.103.1"]

[project.scripts]
support = "kestrel.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
# Notices from inside ADK and OpenTelemetry, not from this lab; a learner should see only their own results.
filterwarnings = ["ignore::DeprecationWarning:opentelemetry.*", "ignore:.*EXPERIMENTAL.*:UserWarning"]
