<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harvest Lane catalogue</title>
<style>
/* Colours are the workshop tokens in design/tokens.json; a course test pins every hex here to that file. */
:root {
  --paper: #FAFAFA; --card: #FFFFFF; --ink: #151515; --ink-2: #414141; --muted: #606060;
  --line: #DFDFDF; --accent: #FAFF69; --fill-dark: #1F1F1C;
  --pass: #008138; --fail: #BF000F; --wait: #B75000;
  --sans: Inter, Helvetica, Arial, sans-serif; --mono: Inconsolata, "Courier New", Courier, monospace;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans) }
button { font: inherit; cursor: pointer; color: var(--ink) }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px }
header { background: var(--fill-dark); color: var(--paper); padding: 12px 28px; display: flex; align-items: baseline; gap: 14px }
header h1 { margin: 0; font-size: 21px }
header .sub { color: var(--line) }
header .tally { margin-left: auto; font-weight: 700 }
header .tally:empty { display: none }

/* The overnight job: one row per way of filling the catalogue, like a batch dashboard. */
.job { margin: 20px 28px 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px }
.job h2 { margin: 0; padding: 12px 16px 2px; font-size: 18px }
.job > p { margin: 0; padding: 0 16px 10px; color: var(--ink-2) }
.job table { width: 100%; border-collapse: collapse }
.job th { text-align: left; font-weight: 600; font-size: 14px; color: var(--ink-2); padding: 8px 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line) }
.job td { padding: 12px 16px; border-bottom: 1px solid var(--line); font: 17px var(--mono) }
.job tr:last-child td { border-bottom: 0 }
.job td.way { font: 600 16px var(--sans) }
.job td.way small { display: block; font-weight: 400; color: var(--muted); font-size: 14px }
.job td.cheap { color: var(--pass); font-weight: 700 }
.job .run { white-space: nowrap; border: 1px solid var(--ink); border-radius: 6px; padding: 6px 14px; background: var(--accent); font-weight: 600 }
.job .run:disabled { opacity: .6; cursor: wait }
.status { font: 14px var(--sans); color: var(--muted) }
.status.done { color: var(--pass); font-weight: 600 }

/* The storefront the job feeds: filters on the left work only once attributes are filled. */
.store { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; padding: 22px 28px 40px }
.filters h3 { margin: 16px 0 6px; font-size: 15px }
.filters h3:first-child { margin-top: 0 }
.filters label { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 15px; cursor: pointer }
.filters label .n { margin-left: auto; color: var(--muted); font: 14px var(--mono) }
.filters label.off { color: var(--muted); cursor: default }
.filters .person-filter { margin-top: 18px; padding: 10px; border: 2px solid var(--wait); border-radius: 6px; background: var(--card) }
.filters .person-filter label { font-weight: 600; color: var(--wait) }
.empty-note { padding: 14px; border-radius: 6px; background: var(--card); border: 1px dashed var(--muted); color: var(--ink-2); font-size: 15px }
.results-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px }
.results-head h2 { margin: 0; font-size: 20px }
.results-head span { color: var(--muted) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px }
.card { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0; overflow: hidden; display: flex; flex-direction: column }
.card:hover { border-color: var(--ink) }
.card .tile { height: 92px; display: grid; place-items: center; font-size: 44px; background: var(--paper); border-bottom: 1px solid var(--line) }
.card .body { padding: 10px 12px 12px }
.card .name { font-weight: 600; line-height: 1.3; font-size: 15px }
.card .size { font: 14px var(--mono); color: var(--ink-2); margin-top: 4px }
.badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px }
.badge { font-size: 12.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--ink-2); color: var(--ink-2) }
.badge.green { border-color: var(--pass); color: var(--pass) }
.badge.person { background: var(--wait); border-color: var(--wait); color: var(--card) }
.badge.none { border-style: dashed; color: var(--muted); border-color: var(--muted) }
.card.needs { border: 2px solid var(--wait) }
.more { margin-top: 16px; border: 1px solid var(--ink); border-radius: 6px; padding: 7px 14px; background: var(--card) }

/* The product drawer: the retailer's text beside what the job filled, and the decision when one is needed. */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(520px, 100%); background: var(--card); border-left: 1px solid var(--ink); padding: 22px 24px; overflow: auto; box-shadow: -8px 0 0 #1515150D }
.drawer[hidden] { display: none }
.drawer .close { float: right; border: 1px solid var(--ink); border-radius: 6px; background: var(--card); padding: 4px 10px }
.drawer h2 { margin: 0 0 4px; font-size: 22px; line-height: 1.25 }
.drawer .sku { font: 14px var(--mono); color: var(--muted) }
.drawer .text { margin: 14px 0; padding: 12px; background: var(--paper); border-radius: 6px; font: 15px/1.5 var(--mono); white-space: pre-wrap }
.drawer table { width: 100%; border-collapse: collapse; margin-top: 6px }
.drawer th { text-align: left; font-size: 14px; color: var(--ink-2); border-bottom: 2px solid var(--ink); padding: 4px 6px }
.drawer td { padding: 6px; border-bottom: 1px solid var(--line); font: 15px var(--mono) }
.drawer td:first-child { font-family: var(--sans) }
.drawer td.miss { color: var(--fail); font-weight: 700 }
.decide { margin-top: 16px; padding: 12px 14px; border-left: 6px solid var(--wait); background: var(--paper) }
.decide b { color: var(--wait) }
.ok { margin-top: 16px; padding: 12px 14px; border-left: 6px solid var(--pass); background: var(--paper) }
.ok b { color: var(--pass) }
@media (max-width: 860px) { .store { grid-template-columns: 1fr } .job { overflow-x: auto } }
</style>
</head>
<body data-surface="grocery storefront and batch job">
<header><h1>Harvest Lane catalogue</h1><span class="sub" id="sub"></span><span class="tally" id="tally" role="status"></span></header>

<section class="job" aria-labelledby="job-title">
  <h2 id="job-title">Tonight's job: fill the storefront filters</h2>
  <p id="job-about"></p>
  <table>
    <thead><tr><th>Way</th><th>Requests</th><th>Sent this run</th><th>Cost</th><th>Per 1,000 products</th><th>Match the retailer</th><th>Needs a person</th><th></th></tr></thead>
    <tbody id="ways"></tbody>
  </table>
</section>

<main class="store">
  <aside class="filters" id="filters" aria-label="Filters"></aside>
  <section>
    <div class="results-head"><h2 id="results-title">All products</h2><span id="results-count"></span></div>
    <div class="grid" id="grid"></div>
    <button class="more" id="more" hidden>Show more products</button>
  </section>
</main>

<aside class="drawer" id="drawer" hidden aria-label="Product"></aside>

<script>
const WAYS = {
  one: { name: "One request per product", note: "the instructions sent with every product" },
  packed: { name: "Packed", note: "many products under one copy of the instructions" },
};
const CATEGORIES = {
  produce: ["Produce", "🥬"], dairy: ["Dairy", "🧀"], bakery: ["Bakery", "🍞"], meat_seafood: ["Meat and seafood", "🐟"],
  pantry: ["Pantry", "🥫"], snacks: ["Snacks", "🍪"], beverages: ["Drinks", "🧃"], frozen: ["Frozen", "🧊"],
  household: ["Household", "🧽"], personal_care: ["Personal care", "🧴"],
};
// A picture per kind of product, found by a word in its title; the category picture is the fallback.
const PICTURES = [["banana", "🍌"], ["spinach", "🥬"], ["apple", "🍎"], ["oat milk", "🥛"], ["milk chocolate", "🍫"], ["milk", "🥛"],
  ["yogurt", "🥣"], ["cheddar", "🧀"], ["loaf", "🍞"], ["croissant", "🥐"], ["chicken stock", "🍲"], ["chicken", "🍗"], ["salmon", "🐟"],
  ["oats", "🌾"], ["penne", "🍝"], ["peanut", "🥜"], ["chips", "🌮"], ["biscuits", "🍪"], ["sparkling", "💧"], ["coffee", "☕"],
  ["pizza", "🍕"], ["vegetable", "🥕"], ["platter", "🍱"], ["soap", "🧼"], ["towels", "🧻"], ["shampoo", "🧴"], ["toothpaste", "🪥"]];
const PAGE_SIZE = 24;
const $ = (id) => document.getElementById(id);
let shelf, runs = {}, shown = "packed", filter = { category: null, organic: false, vegan: false, person: false }, limit = PAGE_SIZE;

const money = (amount) => "$" + amount.toFixed(amount < 0.01 ? 4 : 3);
const escapeHtml = (text) => String(text).replace(/[&<>]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[char]);

// The storefront shows whichever run finished last, so the filters are what that job produced.
function current() { return runs[shown] }

function drawJob() {
  const productCount = shelf.products.length;
  $("sub").textContent = `${productCount} products from retailers, filled by ${shelf.model}`;
  $("job-about").textContent = `Retailers send a title and a description. The storefront needs category, size, organic and vegan. Packed sends ${shelf.size} products per request. A rerun reads the checkpoint and sends only what is not done yet.`;
  const cheapest = Math.min(...Object.values(runs).map((run) => run.per_thousand));
  $("ways").innerHTML = Object.entries(WAYS).map(([way, details]) => {
    const run = runs[way];
    const cell = (value) => (run ? value : "<span class='status'>not run</span>");
    return `<tr><td class="way">${details.name}<small>${details.note}</small></td>
      <td>${cell(run && run.requests)}</td>
      <td>${cell(run && `${run.sent}${run.sent === 0 ? " <span class='status done'>all in the checkpoint</span>" : ""}`)}</td>
      <td>${cell(run && money(run.cost))}</td>
      <td class="${run && run.per_thousand === cheapest && Object.keys(runs).length > 1 ? "cheap" : ""}">${cell(run && money(run.per_thousand))}</td>
      <td>${cell(run && `${run.right} of ${run.total}`)}</td>
      <td>${cell(run && Object.keys(run.person).length)}</td>
      <td><button class="run" data-way="${way}">${run ? "Run again" : "Run"}</button></td></tr>`;
  }).join("");
  for (const button of document.querySelectorAll(".run")) button.onclick = () => fill(button.dataset.way, button);
  const run = current();
  $("tally").textContent = run ? `Filled with no person: ${run.filled} of ${productCount}. ${Object.keys(run.person).length} need a person.` : "";
}

function matches(product) {
  const run = current(), attributes = run && run.attributes[product.sku];
  if (filter.person) return run && product.sku in run.person;
  if (!attributes) return !filter.category && !filter.organic && !filter.vegan;
  if (filter.category && attributes.category !== filter.category) return false;
  if (filter.organic && !attributes.organic) return false;
  // A product waiting on a person never shows under vegan: it is not guessed.
  if (filter.vegan && (attributes.vegan !== "yes" || product.sku in run.person)) return false;
  return true;
}

function drawFilters() {
  const run = current(), panel = $("filters");
  if (!run) {
    panel.innerHTML = `<div class="empty-note">No product has a category, size or diet yet, so shoppers cannot filter. Run tonight's job to fill them.</div>`;
    return;
  }
  const counts = {};
  for (const attributes of Object.values(run.attributes)) counts[attributes.category] = (counts[attributes.category] || 0) + 1;
  const all = Object.values(run.attributes);
  panel.innerHTML = `<h3>Category</h3>` +
    `<label><input type="radio" name="cat" value="" ${!filter.category ? "checked" : ""}> All <span class="n">${all.length}</span></label>` +
    Object.entries(CATEGORIES).map(([category, [name]]) => `<label><input type="radio" name="cat" value="${category}" ${filter.category === category ? "checked" : ""}> ${name} <span class="n">${counts[category] || 0}</span></label>`).join("") +
    `<h3>Diet and farming</h3>` +
    `<label><input type="checkbox" id="f-organic" ${filter.organic ? "checked" : ""}> Organic <span class="n">${all.filter((attributes) => attributes.organic).length}</span></label>` +
    `<label><input type="checkbox" id="f-vegan" ${filter.vegan ? "checked" : ""}> Vegan <span class="n">${all.filter((attributes) => attributes.vegan === "yes").length}</span></label>` +
    `<div class="person-filter"><label><input type="checkbox" id="f-person" ${filter.person ? "checked" : ""}> Needs a person <span class="n">${Object.keys(run.person).length}</span></label></div>`;
  for (const input of panel.querySelectorAll("input[name=cat]")) input.onchange = () => { filter.category = input.value || null; filter.person = false; limit = PAGE_SIZE; drawFilters(); drawGrid() };
  $("f-organic").onchange = (event) => { filter.organic = event.target.checked; limit = PAGE_SIZE; drawGrid() };
  $("f-vegan").onchange = (event) => { filter.vegan = event.target.checked; limit = PAGE_SIZE; drawGrid() };
  // The person queue is every product waiting on someone, whatever its category, so the category resets to All.
  $("f-person").onchange = (event) => { filter.person = event.target.checked; if (filter.person) filter.category = null; limit = PAGE_SIZE; drawFilters(); drawGrid() };
}

function size(attributes) { return attributes.size_unit === "count" ? `${attributes.size_value} count` : `${attributes.size_value} ${attributes.size_unit}` }

function card(product) {
  const run = current(), attributes = run && run.attributes[product.sku], needs = run && product.sku in run.person;
  const kind = PICTURES.find(([word]) => product.title.toLowerCase().includes(word));
  const icon = kind ? kind[1] : attributes ? CATEGORIES[attributes.category][1] : "📦";
  let badges = "";
  if (!attributes) badges = `<span class="badge none">No filters yet</span>`;
  else {
    badges += `<span class="badge">${CATEGORIES[attributes.category][0]}</span>`;
    if (attributes.organic) badges += `<span class="badge green">Organic</span>`;
    if (attributes.vegan === "yes" && !needs) badges += `<span class="badge green">Vegan</span>`;
    if (needs) badges += `<span class="badge person">Needs a person</span>`;
  }
  return `<button class="card ${needs ? "needs" : ""}" data-sku="${product.sku}"><div class="tile" aria-hidden="true">${icon}</div><div class="body">
    <div class="name">${escapeHtml(product.title)}</div><div class="size">${attributes ? size(attributes) : "size unknown"}</div><div class="badges">${badges}</div></div></button>`;
}

function drawGrid() {
  const list = shelf.products.filter(matches);
  $("results-title").textContent = filter.person ? "Products that need a person" : filter.category ? CATEGORIES[filter.category][0] : "All products";
  $("results-count").textContent = `${list.length} products`;
  $("grid").innerHTML = list.slice(0, limit).map(card).join("");
  $("more").hidden = list.length <= limit;
  for (const productCard of document.querySelectorAll(".card")) productCard.onclick = () => open(productCard.dataset.sku);
}

function open(sku) {
  const product = shelf.products.find((candidate) => candidate.sku === sku), run = current(), attributes = run && run.attributes[sku];
  const sample = shelf.supplied[sku];
  const rows = attributes ? ["category", "size_value", "size_unit", "organic", "vegan"].map((field) => {
    const want = sample && sample[field], miss = want !== undefined && String(want) !== String(attributes[field]) && !(field === "size_value" && Math.abs(attributes[field] - want) <= 0.02 * want);
    return `<tr><td>${field}</td><td>${escapeHtml(attributes[field])}</td>${sample ? `<td class="${miss ? "miss" : ""}">${escapeHtml(want)}</td>` : ""}</tr>`;
  }).join("") : "";
  let note = "";
  if (run && sku in run.person) {
    note = `<div class="decide"><b>Needs a person.</b> ${escapeHtml(run.person[sku].charAt(0).toUpperCase() + run.person[sku].slice(1))}.<p>A person decides: they read the pack or ask the retailer, then set vegan. Until then the product stays out of the vegan filter.</p></div>`;
  } else if (attributes) {
    note = `<div class="ok"><b>Filled with no person.</b> Every filter is set from the retailer's own text, so the product is live.</div>`;
  }
  $("drawer").innerHTML = `<button class="close" id="close">Close</button><h2>${escapeHtml(product.title)}</h2><div class="sku">${product.sku}</div>
    <div class="text">${escapeHtml(product.description)}</div>
    ${attributes ? `<table><tr><th>Filter</th><th>Filled tonight</th>${sample ? "<th>Retailer's sample</th>" : ""}</tr>${rows}</table>` : "<p>Nothing is filled yet.</p>"}
    ${note}`;
  $("drawer").hidden = false;
  $("close").onclick = () => { $("drawer").hidden = true };
  $("close").focus();
}

async function fill(way, button) {
  const productCount = shelf.products.length;
  button.disabled = true;
  button.textContent = runs[way] ? "Reading the checkpoint..." : `Filling ${productCount} products...`;
  runs[way] = await (await fetch(`/api/fill/${way}`, { method: "POST" })).json();
  shown = way;
  drawJob(); drawFilters(); drawGrid();
}

document.addEventListener("keydown", (event) => { if (event.key === "Escape") $("drawer").hidden = true });
$("more").onclick = () => { limit += PAGE_SIZE; drawGrid() };

(async () => {
  shelf = await (await fetch("/api/shelf")).json();
  drawJob(); drawFilters(); drawGrid();
})();
</script>
</body>
</html>
