[project]
name = "lab-03-batch-prompts"
version = "0.1.0"
description = "Process a Million Prompts with Batch APIs: fill a grocery catalogue for less per thousand"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.14",
    "openai>=1.100",
    "pydantic>=2.11",
]

[project.scripts]
catalog = "catalog.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
