[project]
name = "lab-36-capstone-rfc"
version = "0.1.0"
description = "Scope a Production AI System with an Architecture RFC: failure modes, latency budgets and an eval plan checked against a benchmark signed before build"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
brickhaven-rfc = "brickhaven_rfc.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brickhaven_rfc"]

[tool.pytest.ini_options]
markers = ["proof: checks the RFC against the signed benchmark and budget; no model, no key"]
addopts = "-m 'not proof'"
