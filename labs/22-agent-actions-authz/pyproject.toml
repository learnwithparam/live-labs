[project]
name = "lab-22-agent-actions-authz"
version = "0.1.0"
description = "Authorize AI Agent Actions with RBAC and ABAC: a coding agent that reads freely and asks before anything destructive, enforced by a Cerbos policy"
requires-python = ">=3.11"
dependencies = ["cerbos==0.16.0", "openai==2.54.0"]

[project.scripts]
agent = "wrenfield.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wrenfield"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
# The seed repo under data/ and the scratch copies under out/ carry their own tests; only tests/ is the lab's.
testpaths = ["tests"]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
