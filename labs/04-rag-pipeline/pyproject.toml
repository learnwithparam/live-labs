[project]
name = "lab-04-rag-pipeline"
version = "0.1.0"
description = "Build a RAG Pipeline over PDFs: answer on-call questions from runbooks with a citation that supports them"
requires-python = ">=3.11"
dependencies = ["openai>=1.100", "pydantic>=2.11", "pypdf>=6.1"]

[project.scripts]
oncall = "oncall.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall"]

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
