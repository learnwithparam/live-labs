[project]
name = "lab-09-request-routing"
version = "0.1.0"
description = "Route Requests with LLM Classification: send each ticket to the queue that can solve it, three ways, and count the reassignments"
requires-python = ">=3.11"
dependencies = ["fastembed==0.8.1", "openai>=1.100", "pydantic>=2.11", "httpx>=0.28"]

[project.scripts]
triage = "triage.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]
# The decision model on your laptop. Kept out of the default install so the keyless tests never pull torch.
decider = ["strands-decider==0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"
# Strands Decider has one release, 0.1.0 on 1 Oct 2026; it is the open decision model this lab teaches.
exclude-newer-package = { strands-decider = "2026-10-02T00:00:00Z" }

[tool.pytest.ini_options]
markers = ["proof: calls real models; needs LLM_API_KEY and the decision model"]
addopts = "-m 'not proof'"
