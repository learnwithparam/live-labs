[project]
name = "lab-30-ai-governance"
version = "0.1.0"
description = "Govern AI Systems with an Inventory and Audit Log: an online bank answers an auditor from an AI inventory kept as code and a hash-chained audit log, scored on a labelled set of audit requests"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai==2.54.0",
    "jsonschema==4.26.0",
    # Only the attribute names: each audit record uses the OpenTelemetry GenAI names, so any tracing backend reads it.
    "opentelemetry-semantic-conventions==0.66b0",
]

[project.scripts]
govern = "larkspur.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/larkspur"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
