[project]
name = "lab-25-mcp-gateway"
version = "0.1.0"
description = "Control AI Agent Tool Access with an MCP Gateway: staff agents reach only approved MCP servers through agentgateway, with team tool lists, no token pass-through, one call log and pinned tool hashes"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "openai==2.54.0",
    "uvicorn==0.54.0",
    "grpcio==1.84.0",
    "grpcio-tools==1.84.0",
    "pyjwt[crypto]==2.15.1",
]

[project.scripts]
gateway = "basalt.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basalt"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
