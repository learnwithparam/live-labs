[project]
name = "lab-27-prompt-registry"
version = "0.1.0"
description = "Manage prompts outside your code: a support bot reads its prompt from a self-hosted Langfuse registry, each version is scored on a golden set, and rollback is a label move"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langfuse==4.16.0",
    "openai==2.54.0",
]

[project.scripts]
driftwell = "driftwell.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftwell"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
markers = ["proof: calls a real model and a running Langfuse; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
