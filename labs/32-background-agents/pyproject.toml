[project]
name = "lab-32-background-agents"
version = "0.1.0"
description = "Run background coding agents with cloud sandboxes: issues become tested pull requests, each agent session in its own locked-down container, judged by the repo's own CI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai==2.54.0",
    "pyyaml==6.0.3",
]

[project.scripts]
fleet = "fernhill.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]
# What the sandbox image installs, exported from this lock with hashes, so the image and the host agree.
sandbox = ["openai==2.54.0", "pytest==9.1.1", "ruff==0.16.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fernhill"]

[tool.uv]
# Every dependency resolves to a release at least two weeks old, so a fresh one never lands untested.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
# data/repo has its own tests: they belong to Fernhill's service, not to this lab.
testpaths = ["tests"]
markers = ["proof: calls a real model and runs Docker; needs LLM_API_KEY"]
addopts = "-m 'not proof'"
