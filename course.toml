# The course map. One row per lab; README.md's map is generated from this file
# (`make readme`) and `make check` fails when they differ or a ready lab is missing.
# status: "ready" means the folder exists and passes `make check`; "planned" means not built yet.
# owns: the one concept this lab teaches. `make check` fails when two labs own the same concept;
# a later lab reuses an earlier lab's concept and says so in its README.
# job, truth, metric: the product job, the source of truth outside the model, and the number the
# proof asserts. AGENTS.md says why; `make check` fails a row without them.

title = "Applied AI Engineering for Software Engineers"

